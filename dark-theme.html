<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dark Theme Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }

        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        main {
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }

        .card {
            background-color: #1e1e1e;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.6);
        }

        a {
            color: #4dabf7;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #1f1f1f;
            border-top: 1px solid #333;
            color: #999;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dark Theme Page</h1>
        <p>Simple • Elegant • Easy</p>
    </header>

    <main>
        <div class="card">
            <h2>Welcome</h2>
            <p>This is a basic dark theme webpage using pure HTML & CSS.</p>
            <p><a href="#">Sample link</a></p>
        </div>

        <div class="card">
            <h2>Why Dark Mode?</h2>
            <p>Reduces eye strain and looks clean for modern UI.</p>
        </div>
    </main>

    <footer>
        © 2025 Dark UI
    </footer>

</body>
</html>
